# This file is used to define the scenarios that are run by snakemake. Each entry on the first level is a scenario. 
# Each scenario can contain configuration overrides with respect to the config/config.yaml settings.

post_war_y_5: 
  electricity:
    extendable_carriers:
      Generator: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT, nuclear, coal, lignite, oil, uranium]
      StorageUnit: [] # battery, H2
      Store: [battery, H2]
      Link: [] # H2 pipeline

    custom_powerplants: "data/custom_powerplants_s_year_3.csv"


post_war_y_4:

  electricity:
    extendable_carriers:
      Generator: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT, nuclear, coal, lignite, oil, uranium]
      StorageUnit: [] # battery, H2
      Store: [battery, H2]
      Link: [] # H2 pipeline

    custom_powerplants: "data/custom_powerplants_s_year_3.csv"

    # Year 4: Ukraine - solar, wind, gas (no nuclear, coal, hydro)
    country_extendable_carriers:
      UA:
        Generator: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT]

post_war_y_3:

  electricity:
    extendable_carriers:
      Generator: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT, nuclear, coal, lignite, oil, uranium]
      StorageUnit: [] # battery, H2
      Store: [battery, H2]
      Link: [] # H2 pipeline

    custom_powerplants: "data/custom_powerplants_s_year_3.csv"

    # Year 3: Ukraine - solar, wind only (no gas, nuclear, coal, hydro)
    country_extendable_carriers:
      UA:
        Generator: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float]

post_war_y_2:
  electricity:
    extendable_carriers:
      Generator: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT, nuclear, coal, lignite, oil, uranium]
      StorageUnit: [] # battery, H2
      Store: [battery, H2]
      Link: [] # H2 pipeline

    custom_powerplants: "data/custom_powerplants_s_year_2.csv"

    # Year 2: Ukraine - solar, wind onshore only 
    country_extendable_carriers:
      UA:
        Generator: [solar, solar-hsat, onwind]

post_war_y_1:
  electricity:
    extendable_carriers:
      Generator: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT, nuclear, coal, lignite, oil, uranium]
      StorageUnit: [] # battery, H2
      Store: [battery, H2]
      Link: [] # H2 pipeline

    custom_powerplants: false

    # Year 1: Ukraine - solar only (most restricted)
    country_extendable_carriers:
      UA:
        Generator: [solar, solar-hsat]